services:
  mongodb:
    image: mongo:latest
    container_name: authdb-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=authdb
    volumes:
      - authdb-mongodb-data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: authdb-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  authdb-mongodb-data:
